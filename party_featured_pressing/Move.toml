[package]
name = "party_featured_pressing"
edition = "2024"
license = "Apache 2.0"
authors = ["Miso Labs, Inc. (build@miso.network)"]

# Local deps, not git: this is the one party extension that reaches into the
# protocol. `miso_pressing`'s own dependencies are cross-repo local paths
# (`miso`, `miso_record`), which a git dep can't resolve — it only works with
# the sibling repos checked out side by side under `misonetwork/`. `miso_party`
# has no dependencies of its own, so it shares no package with the pressing
# subtree and there's no duplicate-package conflict.
[dependencies]
miso_party = { git = "https://github.com/misonetwork/party.git", rev = "0127a1501f56461a9345aab040dfde8c62a81dd0" }
miso_pressing = { local = "../../pressing/move" }
